<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elm Learning Project</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
        #d3-chart {
            margin: 20px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Load D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- Load the compiled Elm application -->
    <script src="elm.js"></script>

    <script>
        // Load saved todos from localStorage
        var savedTodos = localStorage.getItem('elm-todos');
        var initialTodos = savedTodos ? JSON.parse(savedTodos) : null;

        // Initialize the Elm app
        var app = Elm.Main.init({
            node: document.getElementById('app'),
            flags: null
        });

        // Port: Load todos from localStorage (JavaScript → Elm)
        if (app.ports && app.ports.loadTodos && initialTodos) {
            setTimeout(function() {
                app.ports.loadTodos.send(initialTodos);
            }, 0);
        }

        // Port: Save todos to localStorage (Elm → JavaScript)
        if (app.ports && app.ports.saveTodos) {
            app.ports.saveTodos.subscribe(function(todosJson) {
                console.log('Saving todos to localStorage:', todosJson);
                localStorage.setItem('elm-todos', JSON.stringify(todosJson));
            });
        }

        // Port: Update D3 chart (Elm → JavaScript)
        if (app.ports && app.ports.updateChart) {
            app.ports.updateChart.subscribe(function(dataPoints) {
                console.log('Updating chart with:', dataPoints);
                renderChart(dataPoints);
            });
        }

        // D3 Chart Rendering Function
        function renderChart(data) {
            var container = d3.select("#d3-chart");

            // Clear previous chart
            container.selectAll("*").remove();

            if (data.length === 0) {
                container.append("p").text("No data to display. Add some data points above!");
                return;
            }

            // Chart dimensions
            var margin = {top: 20, right: 20, bottom: 30, left: 40};
            var width = 600 - margin.left - margin.right;
            var height = 400 - margin.top - margin.bottom;

            // Create SVG
            var svg = container.append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

            // Scales
            var x = d3.scaleBand()
                .range([0, width])
                .padding(0.1)
                .domain(data.map(function(d) { return d.label; }));

            var maxValue = d3.max(data, function(d) { return d.value; });
            var y = d3.scaleLinear()
                .range([height, 0])
                .domain([0, maxValue || 10]);

            // Draw bars
            svg.selectAll(".bar")
                .data(data)
                .enter().append("rect")
                .attr("class", "bar")
                .attr("x", function(d) { return x(d.label); })
                .attr("width", x.bandwidth())
                .attr("y", function(d) { return y(d.value); })
                .attr("height", function(d) { return height - y(d.value); })
                .attr("fill", "steelblue")
                .style("cursor", "pointer")
                .on("mouseover", function() {
                    d3.select(this).attr("fill", "orange");
                })
                .on("mouseout", function() {
                    d3.select(this).attr("fill", "steelblue");
                })
                .on("click", function(event, d) {
                    console.log('Bar clicked:', d.label);
                    if (app.ports && app.ports.barClicked) {
                        app.ports.barClicked.send(d.label);
                    }
                });

            // Add value labels on top of bars
            svg.selectAll(".label")
                .data(data)
                .enter().append("text")
                .attr("class", "label")
                .attr("x", function(d) { return x(d.label) + x.bandwidth() / 2; })
                .attr("y", function(d) { return y(d.value) - 5; })
                .attr("text-anchor", "middle")
                .text(function(d) { return d.value; });

            // X-axis
            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(d3.axisBottom(x));

            // Y-axis
            svg.append("g")
                .call(d3.axisLeft(y));
        }
    </script>
</body>
</html>
