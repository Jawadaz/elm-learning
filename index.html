<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elm Learning Project</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Load the compiled Elm application -->
    <script src="elm.js"></script>

    <script>
         // Load saved todos from localStorage
        var savedTodos = localStorage.getItem('elm-todos');
        var initialTodos = savedTodos ? JSON.parse(savedTodos) : null;

        // Initialize the Elm app
        var app = Elm.Main.init({
            node: document.getElementById('app'),
            flags: null  // We'll use this later to load saved todos
        });

        if (app.ports && app.ports.loadTodos && initialTodos) {
          setTimeout(function() {
              app.ports.loadTodos.send(initialTodos);
          }, 0);
        }

        // Port: Save todos to localStorage (Elm → JavaScript)
        if (app.ports && app.ports.saveTodos) {
            app.ports.saveTodos.subscribe(function(todosJson) {
                console.log('Saving todos to localStorage:', todosJson);
                localStorage.setItem('elm-todos', JSON.stringify(todosJson));
            });
        }
    </script>
</body>
</html>
